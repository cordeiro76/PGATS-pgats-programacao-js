# Trabalho deve executar N1.

name: 'Execução Manual - Trabalho CI'

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Instalando dependências
        run: yarn

      - name: Executando Testes E2E
        run: yarn run e2e
